# Este container só fala HTTP puro na porta 80, dentro da rede Docker
# interna. O TLS é terminado pelo Nginx central (fora deste projeto),
# que roteia crm.gdconecta.com.br até aqui. Não há certificado nem
# redirecionamento para HTTPS neste arquivo — quem cuida disso é o proxy.
server {
    listen 80;
    server_name crm.gdconecta.com.br;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml text/javascript;
    gzip_min_length 1024;

    client_max_body_size 25M;

    # Frontend — React SPA (rotas client-side)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API — proxy reverso para o backend FastAPI
    location /api/ {
        proxy_pass http://gd_crm_api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 50M;
    }

    # Documentação Swagger
    location /docs {
        proxy_pass http://gd_crm_api:8000/docs;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://gd_crm_api:8000/api/v1/openapi.json;
        proxy_set_header Host $host;
    }

    # Uploads (avatares, anexos)
    location /uploads/ {
        proxy_pass http://gd_crm_api:8000/uploads/;
        proxy_set_header Host $host;
    }

    # Health check
    location /health {
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    # Cache de assets estáticos
    location ~* \.(js|css|png|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
