# ============================================================
# Nginx Proxy Reverso Central — GD Conecta
# ============================================================
# Roteia ambas as aplicações (Diagnóstico + CRM) para seus
# respectivos backends usando subdomínios.
# ============================================================

upstream diagnostico_backend {
    server gd_frete_backend:8000;
}

upstream crm_backend {
    server gd_crm_api:8000;
}

# Redireciona HTTP → HTTPS
server {
    listen 80;
    server_name diagnostico.gdconecta.com.br crm.gdconecta.com.br;
    return 301 https://$server_name$request_uri;
}

# HTTPS — GD Diagnóstico
server {
    listen 443 ssl http2;
    server_name diagnostico.gdconecta.com.br;

    ssl_certificate /etc/letsencrypt/live/gdconecta.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gdconecta.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript;

    # Proxy para backend do Diagnóstico
    location / {
        proxy_pass http://diagnostico_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # WebSocket support (se necessário)
    location /ws {
        proxy_pass http://diagnostico_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

# HTTPS — GD CRM
server {
    listen 443 ssl http2;
    server_name crm.gdconecta.com.br;

    ssl_certificate /etc/letsencrypt/live/gdconecta.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gdconecta.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript;

    # Proxy para backend do CRM
    location / {
        proxy_pass http://crm_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # WebSocket support (se necessário)
    location /ws {
        proxy_pass http://crm_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
