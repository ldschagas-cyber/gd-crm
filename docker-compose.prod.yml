# ============================================================
# GD CRM — Ambiente de PRODUÇÃO
# ============================================================
# Uso:
#   cp .env.example .env.prod  # ajuste SECRET_KEY, senhas
#   docker network create gd_conecta_network   # uma única vez no servidor
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# Este servidor hospeda mais de uma aplicação (GD Diagnóstico + GD CRM).
# Por isso o frontend NÃO expõe as portas 80/443 diretamente — quem faz
# isso é o Nginx central em /opt (nginx-proxy.conf), que termina o TLS
# para os dois domínios e encaminha para cada app por dentro da rede
# Docker compartilhada 'gd_conecta_network'.
#
# Aplicação disponível em: https://crm.gdconecta.com.br
# ============================================================

services:

  # ---- Banco de Dados -------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: gd_crm_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-crm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-gd_crm}
    volumes:
      - gd_crm_pg_prod_data:/var/lib/postgresql/data
    # Porta NÃO exposta externamente em produção.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-crm}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - gd_conecta_network

  # ---- Redis (Celery) -------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: gd_crm_redis
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - gd_crm_redis_prod_data:/data
    # Porta NÃO exposta externamente em produção.
    networks:
      - gd_conecta_network

  # ---- Backend (API) -------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gd_crm_api
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - .env.prod
    environment:
      DEBUG: "false"
      ENVIRONMENT: production
    # secrets/ fica fora do Git (.gitignore) — precisa ser copiado
    # manualmente pro servidor (scp) e montado aqui, não fica na imagem.
    volumes:
      - ./secrets:/app/secrets:ro
    # Porta NÃO exposta diretamente — tráfego via frontend/nginx.
    expose:
      - "8000"
    command: >
      sh -c "
        alembic upgrade head &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
      "
    networks:
      - gd_conecta_network

  # ---- Celery Worker -------------------------------------------
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gd_crm_worker
    restart: always
    depends_on:
      - db
      - redis
    env_file:
      - .env.prod
    environment:
      DEBUG: "false"
      ENVIRONMENT: production
    command: ["celery", "-A", "app.core.celery_app.celery_app", "worker", "-Q", "default", "--loglevel=info", "--concurrency=4"]
    networks:
      - gd_conecta_network

  # ---- Celery Beat (Scheduler) --------------------------------
  beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gd_crm_beat
    restart: always
    depends_on:
      - db
      - redis
    env_file:
      - .env.prod
    environment:
      DEBUG: "false"
      ENVIRONMENT: production
    command: ["celery", "-A", "app.core.celery_app.celery_app", "beat", "--loglevel=info"]
    networks:
      - gd_conecta_network

  # ---- Frontend (Nginx) ----------------------------------------
  # HTTP puro na porta 80, apenas dentro da rede Docker. Quem expõe
  # 80/443 ao mundo é o Nginx central (fora deste projeto).
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api/v1   # proxy reverso: /api/v1 → api:8000/api/v1
    container_name: gd_crm_frontend
    restart: always
    expose:
      - "80"
    depends_on:
      - api
    networks:
      - gd_conecta_network

volumes:
  gd_crm_pg_prod_data:
  gd_crm_redis_prod_data:

networks:
  gd_conecta_network:
    external: true
