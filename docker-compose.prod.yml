# ============================================================
# GD CRM — Ambiente de PRODUÇÃO
# ============================================================
# Uso:
#   cp .env.example .env.prod  # ajuste SECRET_KEY, senhas
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# Aplicação disponível em: https://crm.gdconecta.com.br (porta 80/443 via Nginx)
# ============================================================

services:

  # ---- Banco de Dados -------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: gd_crm_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-crm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-gd_crm}
    volumes:
      - gd_crm_pg_prod_data:/var/lib/postgresql/data
    # Porta NÃO exposta externamente em produção.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-crm}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal

  # ---- Redis (Celery) -------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: gd_crm_redis
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - gd_crm_redis_prod_data:/data
    # Porta NÃO exposta externamente em produção.
    networks:
      - internal

  # ---- Backend (API) -------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gd_crm_api
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - .env.prod
    environment:
      DEBUG: "false"
      ENVIRONMENT: production
    # Porta NÃO exposta diretamente — tráfego via frontend/nginx.
    expose:
      - "8000"
    command: >
      sh -c "
        alembic upgrade head &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
      "
    networks:
      - internal

  # ---- Celery Worker -------------------------------------------
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gd_crm_worker
    restart: always
    depends_on:
      - db
      - redis
    env_file:
      - .env.prod
    environment:
      DEBUG: "false"
      ENVIRONMENT: production
    command: ["celery", "-A", "app.core.celery_app.celery_app", "worker", "-Q", "default", "--loglevel=info", "--concurrency=4"]
    networks:
      - internal

  # ---- Celery Beat (Scheduler) --------------------------------
  beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gd_crm_beat
    restart: always
    depends_on:
      - db
      - redis
    env_file:
      - .env.prod
    environment:
      DEBUG: "false"
      ENVIRONMENT: production
    command: ["celery", "-A", "app.core.celery_app.celery_app", "beat", "--loglevel=info"]
    networks:
      - internal

  # ---- Frontend (Nginx) ----------------------------------------
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api/v1   # proxy reverso: /api/v1 → api:8000/api/v1
    container_name: gd_crm_frontend
    restart: always
    ports:
      - "80:80"
      - "443:443"           # TLS termina aqui, com certificado Let's Encrypt
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - api
    networks:
      - internal

volumes:
  gd_crm_pg_prod_data:
  gd_crm_redis_prod_data:

networks:
  internal:
    driver: bridge
